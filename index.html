    <script>
      // Resolve theme and language before the first paint to avoid a flash.
      ;(function () {
        var root = document.documentElement
        var saved = {}
        try {
          saved.theme = localStorage.getItem('ghst-theme')
          saved.locale = localStorage.getItem('ghst-locale')
        } catch (error) {}
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        root.dataset.theme =
          saved.theme === 'day' || saved.theme === 'night' ? saved.theme : prefersLight ? 'day' : 'night'
        if (saved.locale === 'en') root.lang = 'en'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
